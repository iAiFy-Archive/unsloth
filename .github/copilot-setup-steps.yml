name: Copilot Setup Steps
on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # pinned
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # pinned
        with:
          python-version: '3.12'

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version: 'stable'

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
          if [ -f package.json ] && [ ! -f package-lock.json ]; then npm install; fi

      - name: Install Python dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e '.[dev]' 2>/dev/null || pip install -e .; fi

      - name: Install Go dependencies
        run: |
          if [ -f go.mod ]; then go mod download; fi
